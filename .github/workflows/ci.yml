# Runs the same checks as the pre-commit hooks and the README, on every PR and on
# pushes to main, where they can't be skipped. Results: the PR's "Checks" tab.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repo.
permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"
  # Same image as the README's gitleaks commands (keep them in step).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit hashes (tags can be moved); the comment says the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app  # a throwaway database that only exists for this job
          POSTGRES_DB: module_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # So the daisyUI build test runs instead of being skipped.
      - run: uv run python demo/manage.py tailwind download_cli
      - name: Tests with coverage (fails below 80%)
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export DATABASE_URL=postgres://app:app@localhost:5432/module_tests
          fi
          uv run pytest --cov

  audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # The README's command: a failed or out-of-date export fails the job.
      - run: >-
          (f=$(mktemp) && trap 'rm -f "$f"' EXIT
          && uv export --locked --format requirements-txt --no-emit-project --quiet -o "$f"
          && uv run pip-audit --disable-pip --require-hashes -r "$f")

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, not just the latest commit
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact
