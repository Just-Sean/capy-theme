# Checks that run on every `git commit` (set up once with `uv run pre-commit install`).
# Run them on every file with `uv run pre-commit run --all-files`.
repos:
  # Blocks commits that contain passwords, keys or tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lint and formatting, with the project's own ruff (the version in uv.lock).
  # --force-exclude keeps ruff's own exclusions (migrations) when pre-commit passes file names.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
