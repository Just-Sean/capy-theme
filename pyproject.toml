[project]
name = "capy-theme"
version = "0.7.0"
description = "Theming for Django projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = [
    "coloraide>=8,<9",        # reads colors in any CSS format and converts to OKLCH
    "defusedxml>=0.7.1,<0.8",  # parses uploaded SVGs safely (no entities or DTDs)
    "django>=6.1,<7",          # the Django versions this module supports
    "fonttools[woff]>=4,<5",  # checks uploaded fonts and converts them to WOFF2 (with Brotli)
    "jsonschema>=4.26,<5",    # validates Theme.settings against settings.schema.json
    "pillow>=13,<14",         # checks uploaded logo images (Django ImageField)
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Private :: Do Not Upload",    # stops an accidental upload to the public PyPI
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "capy_theme"   # the folder under src/

[dependency-groups]
# Only for developing and testing the module; projects never install these.
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "dj-database-url>=3.1",     # lets the tests switch databases via DATABASE_URL
    "psycopg[binary]>=3.3",     # only used when DATABASE_URL points at Postgres
    "ruff>=0.17",
    "django-tailwind-cli>=4.8",
    "djangorestframework>=3.16,<4",  # only to test the API in DRF mode (7.1); never required
    "drf-spectacular>=0.28,<1",      # only to test the API appears in generated API docs
    "pre-commit>=4.7",
    "pip-audit>=2.10",          # checks the locked dependencies for known vulnerabilities
    "pytest-cov>=7.1",          # test coverage (uv run pytest --cov)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
addopts = "--strict-markers"
# Fail on Django deprecation warnings, so Django upgrades never surprise you.
filterwarnings = ["error::DeprecationWarning:django.*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "DJ", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106"]
"demo/demo_site/settings.py" = ["S105"]   # the demo's dev-only SECRET_KEY

# Test coverage, measured with `uv run pytest --cov` (pytest-cov).
[tool.coverage.run]
source = ["capy_theme"]
branch = true                 # also checks both sides of every if/else
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true           # lists the lines the tests never run
skip_covered = true           # leaves fully covered files out of the list
fail_under = 80               # `pytest --cov` fails if total coverage drops below 80%
