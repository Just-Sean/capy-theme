{% load static %}{% comment %}
  Loads the live theme editor for a staff user who can edit. Output by
  {% theme_head %}, so it sits in <head>: the editor's settings are data
  attributes on its <script> tag (a <div> isn't allowed in <head>). The panel
  itself is built by editor.js. Any element with data-capy-editor-open opens it.
{% endcomment %}
<link rel="stylesheet" href="{% static 'capy_theme/editor/editor.css' %}">
<script id="capy-editor" src="{% static 'capy_theme/editor/editor.js' %}" defer
        data-theme-id="{{ editor.theme.pk }}"
        data-theme-name="{{ editor.theme.name }}"
        data-floating-button="{% if editor.floating_button %}true{% else %}false{% endif %}"
        data-state-url="{{ editor.urls.state }}"
        data-preview-url="{{ editor.urls.preview }}"
        data-suggestions-url="{{ editor.urls.suggestions }}"
        data-save-url="{{ editor.urls.save }}"
        data-publish-url="{{ editor.urls.publish }}"
        data-csrf-token="{{ csrf_token }}"></script>
{# The panel's controls: core.js first, then one file per section (run in this order). #}
<script src="{% static 'capy_theme/editor/controls/core.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/bases.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/colors.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/suggestions.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/fonts.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/images.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/image-choices.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/shape.js' %}" defer></script>
<script src="{% static 'capy_theme/editor/controls/actions.js' %}" defer></script>
