<div class="space-y-3">
  <h3 class="text-xl font-semibold">Branding</h3>
  <div class="flex flex-wrap items-center gap-4 rounded-box bg-base-200 p-4">
    {% if brand.logo_url %}
      <img src="{{ brand.logo_url }}" alt="{{ brand.logo_alt }}" class="h-12 w-auto">
    {% endif %}
    <div>
      <div class="text-xl font-bold">{{ brand.site_name|default:"(no site name)" }}</div>
      <div class="text-sm opacity-70">{{ brand.tagline|default:"(no tagline)" }}</div>
    </div>
  </div>
  {% if not brand.logo_url %}<p class="text-sm opacity-70">No logo uploaded: {% templatetag openblock %} theme_logo {% templatetag closeblock %} shows the site name instead.</p>{% endif %}
</div>
